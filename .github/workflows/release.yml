name: Release (model + app CD)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  MODEL_VERSION: ${{ github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest
      - run: python scripts/validate_data.py
      - run: python scripts/train_model.py
      - run: python scripts/evaluate.py
      - run: python scripts/ci_quality_gate.py
      - run: python scripts/package_model.py --require-gates --version "$MODEL_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: |
            models/
            reports/evaluation_results.json
            reports/quality_gate_result.json

  publish:
    needs: build-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-bundle
          path: .
      - name: GitHub Release with versioned model assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            models/coverwise_model.joblib
            models/MANIFEST.json
            models/MODEL_CARD.md
            models/metrics.json
            reports/quality_gate_result.json
          generate_release_notes: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: coverwise-ai:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the candidate container
        run: |
          docker run -d --name candidate -p 8501:8501 coverwise-ai:candidate
          pip install requests
          python scripts/smoke_test.py --url http://localhost:8501 --wait 90
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
